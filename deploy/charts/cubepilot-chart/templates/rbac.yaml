# RBAC (components separated, RBAC minimized per component). The six
# ai.cubestack.io platform CRDs are Namespaced: every component's CRD access
# is a Role in the install namespace,
# bound by a RoleBinding to its ServiceAccount. Cluster-scope RBAC remains
# only where the object is genuinely cluster-scoped: CRD discovery
# (apiextensions), the per-user assistant identity (the agent executes kubectl
# with the user's identity and must operate platform CRs in any namespace,
# e.g. generic CRD discovery creating CubeStack DevEnvironments), and leader
# election. The agent's role stays broad for now (per-user minimal RBAC is
# the production contract).
#
# Inspection runs as the creator with the creator's permissions -- no
# dedicated read-only credentials;
# read-only is enforced by the inspection template behavior + RBAC fallback.

# --- ServiceAccounts ---
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.operator }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.api }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.agent }}
  namespace: {{ .Release.Namespace }}

# --- Operator: namespaced resources + platform CRDs + leader-election + events
# ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Secrets: the operator resolves credentialRef for the providers inlined in
  # AgentTemplate.spec.providers (no standalone Model CRD;
  # credentials are platform-managed Secret references) and reconciles the
  # openclaw-config Secret (rendered gateway config).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Per-user identity: the operator mints a ServiceAccount per user
  # and its token Secret so no admin-supplied kubeconfig is needed.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Learned allowlist grants: the resolver reads the per-user grants
  # ConfigMap, and the task runner reaches the resolver through
  # SelectedModelFor -- so the operator needs the read, not only the API server.
  # The client is the manager's cached one, hence list/watch alongside get.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Platform CRDs are Namespaced: full CRUD + status on the
  # ai.cubestack.io objects in this namespace (controllers + builtin bootstrap).
  - apiGroups: ["ai.cubestack.io"]
    resources: ["agenttemplates", "agentinstances", "skills", "tasktemplates", "tasks", "taskruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["agentinstances/status", "agenttemplates/status", "skills/status", "tasks/status", "taskruns/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.operator.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.operator }}
    namespace: {{ .Release.Namespace }}

# --- Operator: cluster-scope RBAC the operator still needs (CRD discovery +
# binding the per-user assistant roles) ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.operator.name }}-crds
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Per-user identity: bind each user's SA to `view` (namespaced read-only,
  # excludes secrets), cubepilot-cluster-read (the cluster-scoped read `view`
  # does not grant) and cubepilot-user-crds (cluster-wide ai.cubestack.io CRUD
  # -- the assistant operates platform CRs in any namespace), and own the
  # per-user ClusterRoleBindings. The operator cannot create a binding whose
  # roleRef it may not `bind`, so every per-user role name has to be listed
  # here -- a missing one fails at runtime, in the operator log.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "list", "watch", "bind"]
    resourceNames: ["view", "cubepilot-cluster-read", "cubepilot-user-crds"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.operator.name }}-crds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.operator.name }}-crds
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.operator }}
    namespace: {{ .Release.Namespace }}

# --- Per-user platform identity: each user's assistant SA gets the
# built-in cluster `view`, the cluster-scoped read below, and full
# ai.cubestack.io CRUD via this ClusterRole. The operator creates one
# ClusterRoleBinding per user's SA per role. Kept cluster-scoped even though the
# six platform CRDs are Namespaced: the assistant runs kubectl as the user and
# must operate platform CRs (including CubeStack CRDs like DevEnvironment) in
# any namespace, not only the install namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cubepilot-user-crds
rules:
  - apiGroups: ["ai.cubestack.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# --- Per-user cluster-scoped read. The built-in `view` role is namespaced by
# design and grants nothing cluster-scoped, so every check that starts from node
# state -- the cluster-inspection and gpu-inspection skills, and the
# daily-inspection preset -- reads nothing without this. Bound alongside `view`
# rather than aggregated into it: aggregation would change what `view` means for
# every subject in the cluster bound to it, including ones outside this product.
#
# RBAC has no deny rules, and `apiGroups: ["*"]` matches the core group too --
# which is where secrets live, beside pods and configmaps. So the core group is
# enumerated with the exclusions written out, while the remaining native groups
# take a wildcard, none of them holding a secret or a proxy.
#
# Deliberately excluded, and not to be added without a fresh look:
#   secrets                       -- in any namespace, the platform's included;
#                                    the whole point of this role
#   nodes/proxy, pods/proxy,
#   services/proxy                -- these accept `get`, so read-only verbs do
#                                    not exclude them the way they exclude
#                                    pods/exec, serviceaccounts/token and
#                                    bindings. nodes/proxy reaches the kubelet
#                                    API: read any file on the node, start
#                                    containers, run commands -- a bigger hole
#                                    than the secrets this role is careful about
#   pods/exec, pods/attach,
#   pods/portforward,
#   pods/ephemeralcontainers      -- they exist to carry `create`/`update`; the
#                                    `get` they also accept buys nothing here
#
# Known soft spot: some CSI drivers put values in spec.volumeAttributes of a
# volumeattachment. Well-behaved drivers reference their credentials instead.
#
# Third-party API groups (cert-manager, prometheus-operator, an operator of the
# customer's own) are not listed: a shipped role cannot know what an arbitrary
# cluster has installed. Add the group name here when one is wanted.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cubepilot-cluster-read
rules:
  # The core group, enumerated in full minus the exclusions listed above.
  - apiGroups: [""]
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - namespaces/status
      - nodes
      - nodes/status
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - persistentvolumes/status
      - pods
      - pods/log
      - pods/status
      - podtemplates
      - replicationcontrollers
      - replicationcontrollers/scale
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
      - serviceaccounts
      - services
      - services/status
    verbs: ["get", "list", "watch"]
  # Every other native group, whole. Reading the create-only APIs here
  # (tokenreviews, subjectaccessreviews) is inert.
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - authentication.k8s.io
      - authorization.k8s.io
      - autoscaling
      - batch
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - flowcontrol.apiserver.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # The platform's own group, so this role stands on its own as a statement of
  # what the assistant can read. cubepilot-user-crds grants the same group with
  # write verbs; the overlap is deliberate.
  - apiGroups: ["ai.cubestack.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

# --- API: platform CRD access (namespaced) + cluster CRD discovery ---
# task facade: the Portal creates/toggles/runs Tasks as CRs; the operator owns
# TaskRun writes. Instance writes: users self-provision their own AgentInstance
# CR; the operator owns the Pod/PVC/Service lifecycle.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.api.name }}-crds
  namespace: {{ .Release.Namespace }}
rules:
  # handleAddLLM updates only the builtin AgentTemplate (POST /api/llms); the
  # other platform CRDs stay read-only for the API (credential minimization),
  # except Skills: the API owns the skill repository, so it creates/updates the
  # Skill CRs + status when publishing (operator seed / Portal publish).
  - apiGroups: ["ai.cubestack.io"]
    resources: ["agenttemplates"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["skills"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["skills/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["tasktemplates", "taskruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["tasks", "agentinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.api.name }}-crds
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.api.name }}-crds
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.api }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.api.name }}
rules:
  # The skill catalog discovers the ai.cubestack.io CRD schemas at startup
  # (apiextensions is cluster-scoped).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.api.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.api.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.api }}
    namespace: {{ .Release.Namespace }}

# --- API: namespaced credential Secret lifecycle. The model entry itself lives
# on the builtin AgentTemplate, but its apiKey Secret is owned here: POST
# /api/llms creates it, PUT /api/llms/{name} updates it (key rotation, and a
# keyless model becoming keyed) or deletes it (demoted to public), and DELETE
# /api/llms/{name} deletes it with the model. Granting only `create` leaves a
# rotation failing with 403 and a removed model's live key behind in the
# namespace. ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
  # Learned allow-always grants: the API is the sole writer of the
  # per-user grants ConfigMap. The verbs are exactly what the store uses -- Get,
  # Create, Update, and nothing else: a revoked grant deletes its key and leaves
  # the ConfigMap in place, so there is no Delete, and the store never Patches.
  # No list/watch either, because the API builds its client with client.New (a
  # direct, uncached client, cmd/cubepilot-api/main.go), so no informer runs.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.api.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.api }}
    namespace: {{ .Release.Namespace }}

# --- Agent: read cluster state, write pods (broad for now) ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.serviceAccounts.agent }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Platform CRDs (DevEnvironment / InferenceService / ...) -- current wildcard.
  - apiGroups: ["ai.cubestack.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.serviceAccounts.agent }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.serviceAccounts.agent }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.agent }}
    namespace: {{ .Release.Namespace }}

# --- Agent: read credential Secrets. The supervisor (in-cluster SA) reads the
# model credential Secrets and writes their apiKeys into the pod's emptyDir
# keys.json, which the gateway's file secret provider reads. The literal key
# never lands in the rendered config or the PVC. ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.serviceAccounts.agent }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccounts.agent }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.serviceAccounts.agent }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.agent }}
    namespace: {{ .Release.Namespace }}
