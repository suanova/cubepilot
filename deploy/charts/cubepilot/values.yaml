# CubePilot Helm values -- registry-addressed defaults
# (harbor.isuanova.com/suanova). The default :latest tags track the rolling
# builds published from main (see .github/workflows/release.yaml); pin a real
# release by overriding the image refs (e.g. --set operator.image=...:0.1.0).
# scripts/setup.sh always passes explicit image refs, so local development is
# unaffected.

# --- shared ---------------------------------------------------------------
# Image pull policy for all components.
imagePullPolicy: IfNotPresent

# Agent runtime config (per-user OpenClaw instances, design §5).
# runtime names the agent runtime image family: openclaw today, hermes later.
agents:
  runtime: openclaw
  image: harbor.isuanova.com/suanova/cubepilot-openclaw:latest
  # Comma-separated operator identities, one independent instance each.
  # Default: a single 'admin'. Add users here and re-deploy -- the operator
  # mints a per-user identity (SA + kubeconfig Secret) for each at deploy time.
  users: admin
  # Platform default LLM (optional). Both are empty by default: the builtin
  # agent-for-cloud template is created with no default model and LLMs are
  # added from the Portal (Agent Config -> LLM Config). Set an endpoint AND a
  # model name to seed a ready default model at template creation (its apiKey
  # comes from the cubepilot-llm Secret; the builtin deepseek defaults that
  # scripts/setup.sh passes are examples, not chart defaults).
  llmEndpoint: ""
  llmModel: ""
  # Resident by default; idle reclaim is a configurable policy (FR-M2-002).
  reclaim: "false"
  idleTTL: 30m
  gcWindow: 72h
  gcWatermark: "0.7"

# Secrets. Names are fixed in Go (internal/k8s), not configurable here:
#   openclaw-config   generated by the operator (gateway token + openclaw.json)
#   agent-kubeconfig  rendered by this chart (see templates/agent-kubeconfig.yaml)
#   cubepilot-llm     created by scripts/setup.sh (platform default LLM apiKey);
#                     additional LLM apiKeys land in llm-<name> Secrets created
#                     from the Portal (Agent Config -> LLM Config)

# --- operator (control plane, leader election, no HTTP/PVC) --------------
operator:
  name: cubepilot-operator
  replicas: 2
  image: harbor.isuanova.com/suanova/cubepilot-operator:latest
  # controller-runtime metrics + health/ready probes ("0" disables).
  metricsAddr: :8082
  probeAddr: :8081
  resources: {}
  nodeSelector: {}
  tolerations: []

# --- api (Portal REST/SSE + JSON metadata store, single RWO PVC) ---------
api:
  name: cubepilot-api
  replicas: 1
  image: harbor.isuanova.com/suanova/cubepilot-api:latest
  dataDir: /opt/cubepilot/data
  storage: 1Gi
  storageClassName: ""
  # skillRepo is the shared skill repository (design §2.2). Only the API
  # server mounts it (publish + serve); the operator publishes over HTTP. The
  # API is single-replica, so ReadWriteOnce is the default (works on kind's
  # local-path StorageClass); production multi-replica sets accessModes
  # [ReadWriteMany] with a CephFS RWX StorageClass.
  skillRepo:
    storageClassName: ""
    accessModes: [ReadWriteOnce]
    size: 1Gi
    # existingClaim: ""    # reuse an existing PVC instead of creating one
  resources: {}
  nodeSelector: {}
  tolerations: []
  # hitl enables human-in-the-loop write confirmations (issue #20). When on,
  # the API auto-generates and persists a device master key in a Secret (no
  # operator key to supply) and the in-pod supervisors auto-pair the derived
  # per-user devices; interactive chat write operations pause for Portal
  # approval. Set to false to disable (writes pass through as today).
  hitl:
    enabled: true
  # extraEnv appends arbitrary environment variables to the API container.
  # Each entry is {name, value} for a literal, or
  # {name, secretKeyRef:{name, key}} to source a secret.
  extraEnv: []

# --- web (independent React SPA, stateless, nginx) ------------------------
web:
  # enabled installs the standalone web portal (React SPA). Set to false to
  # skip it -- e.g. when CubeStack provides a unified UI that talks to the
  # cubepilot API directly. The api + operator remain fully installable
  # without the portal.
  enabled: true
  name: cubepilot-web
  replicas: 2
  image: harbor.isuanova.com/suanova/cubepilot-web:latest
  resources: {}
  nodeSelector: {}
  tolerations: []

# --- service accounts ------------------------------------------------------
serviceAccounts:
  operator: cubepilot-operator
  api: cubepilot-api
  agent: cubepilot-agent
