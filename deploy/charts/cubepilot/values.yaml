# CubePilot Helm values -- registry-addressed defaults
# (harbor.isuanova.com/cubestack); override the tag for real releases.

# --- shared ---------------------------------------------------------------
# Image pull policy for all components.
imagePullPolicy: IfNotPresent

# Agent runtime config (per-user OpenClaw instances, design §5).
# runtime names the agent runtime image family: openclaw today, hermes later.
agents:
  runtime: openclaw
  image: harbor.isuanova.com/cubestack/cubepilot-openclaw:local
  # Comma-separated operator identities, one independent instance each.
  users: zhang.wei,li.ming
  # Resident by default; idle reclaim is a configurable policy (FR-M2-002).
  reclaim: "false"
  idleTTL: 30m
  gcWindow: 72h
  gcWatermark: "0.7"

# Existing secrets to consume (created out-of-band, e.g. by scripts/setup.sh --
# they hold host-derived LLM/gateway credentials and are never templated).
secrets:
  # openclaw.json (agent runtime config) + gatewayToken key.
  openclawConfig: openclaw-config
  # In-cluster kubeconfig for agent pods (key: config).
  agentKubeconfig: agent-kubeconfig

# --- operator (control plane, leader election, no HTTP/PVC) --------------
operator:
  name: cubepilot-operator
  replicas: 2
  image: harbor.isuanova.com/cubestack/cubepilot-operator:local
  # controller-runtime metrics + health/ready probes ("0" disables).
  metricsAddr: :8082
  probeAddr: :8081
  resources: {}
  nodeSelector: {}
  tolerations: []

# --- api (Portal REST/SSE + JSON metadata store, single RWO PVC) ---------
api:
  name: cubepilot-api
  replicas: 1
  image: harbor.isuanova.com/cubestack/cubepilot-api:local
  dataDir: /opt/cubepilot/data
  storage: 1Gi
  storageClassName: ""
  resources: {}
  nodeSelector: {}
  tolerations: []

# --- web (independent Vue SPA, stateless, nginx) --------------------------
web:
  name: cubepilot-web
  replicas: 2
  image: harbor.isuanova.com/cubestack/cubepilot-web:local
  resources: {}
  nodeSelector: {}
  tolerations: []

# --- service accounts ------------------------------------------------------
serviceAccounts:
  operator: cubepilot-operator
  api: cubepilot-api
  agent: cubepilot-agent
