# RBAC (design §9 / §11.1: components separated, RBAC minimized per
# component). ClusterRoles use fixed names -- single-instance per cluster;
# operator owns the control plane, api reads CRDs only, agent is broad for
# now (FR-M3-001 per-user minimal RBAC is the production contract).
#
# Inspection (FR-M4-007) runs as the creator with the creator's permissions
# (design §5.4 / FR-M4 authorization) -- no dedicated read-only credentials;
# read-only is enforced by the inspection template behavior + RBAC fallback.

# --- ServiceAccounts ---
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.operator }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.api }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.agent }}
  namespace: {{ .Release.Namespace }}

# --- Operator: namespaced resources + leader-election Lease + events ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Secrets: the operator resolves credentialRef for models inlined in
  # AgentTemplate.spec.models (design §3.3: no standalone Model CRD;
  # credentials are platform-managed Secret references) and reconciles the
  # openclaw-config Secret (rendered gateway config).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.operator.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.operator }}
    namespace: {{ .Release.Namespace }}

# --- Operator: cluster-scoped platform CRDs (full CRUD + status) ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.operator.name }}-crds
rules:
  - apiGroups: ["ai.cubestack.io"]
    resources: ["agenttemplates", "agentinstances", "skills", "tasktemplates", "tasks", "taskruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["agenttemplates/status", "agentinstances/status", "tasks/status", "taskruns/status", "skills/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.operator.name }}-crds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.operator.name }}-crds
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.operator }}
    namespace: {{ .Release.Namespace }}

# --- API: read-only platform CRDs + Task/Instance writes (task facade:
# the Portal creates/toggles/runs Tasks as CRs; the operator owns TaskRun
# writes. Instance writes: users self-provision their own AgentInstance CR;
# the operator owns the Pod/PVC/Service lifecycle) ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.api.name }}
rules:
  # handleAddLLM updates only the builtin AgentTemplate (POST /api/llms); the
  # other platform CRDs stay read-only for the API (credential minimization).
  - apiGroups: ["ai.cubestack.io"]
    resources: ["agenttemplates"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["skills", "tasktemplates", "taskruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ai.cubestack.io"]
    resources: ["tasks", "agentinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.api.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.api.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.api }}
    namespace: {{ .Release.Namespace }}

# --- API: namespaced credential Secret creation (POST /api/llms writes the
# apiKey Secret; the model entry itself lives on the builtin AgentTemplate) ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.api.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.api }}
    namespace: {{ .Release.Namespace }}

# --- Agent: read cluster state, write pods (broad for now, FR-M3-001) ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.serviceAccounts.agent }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Platform CRDs (DevEnvironment / InferenceService / ...) -- current wildcard.
  - apiGroups: ["ai.cubestack.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.serviceAccounts.agent }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.serviceAccounts.agent }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.agent }}
    namespace: {{ .Release.Namespace }}

# --- Agent: read credential Secrets. The supervisor (in-cluster SA) reads the
# model credential Secrets and writes their apiKeys into the pod's emptyDir
# keys.json, which the gateway's file secret provider reads. The literal key
# never lands in the rendered config or the PVC. ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.serviceAccounts.agent }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccounts.agent }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.serviceAccounts.agent }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.agent }}
    namespace: {{ .Release.Namespace }}
