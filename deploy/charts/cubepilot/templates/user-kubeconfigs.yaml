{{/*
Per-user kubeconfig Secrets (dual-kubeconfig, issue #19). For every user listed
under agents.kubeconfigs the chart renders a Secret named
"<sanitized(user)>-kubeconfig" (key: config) which the operator mounts as the
agent's default ~/.kube/config, so kubectl runs as the user. Users not listed
here must have that Secret created out-of-band (otherwise the agent falls back
to the shared agent-kubeconfig / SA identity). Prefer out-of-band Secrets in
production -- kubeconfigs carry credentials.
*/}}
{{- range $user, $content := .Values.agents.kubeconfigs }}
{{- if $content }}
---
apiVersion: v1
kind: Secret
metadata:
  # Mirrors internal/k8s.UserKubeconfigSecretFor: sanitized identity + an
  # 8-hex digest of the raw identity, so identities that sanitize the same
  # (e.g. foo.bar / foo_bar) still get distinct Secrets.
  name: {{ printf "%s-kubeconfig-%s" (include "cubepilot.sanitize" $user) (substr 0 8 (sha256sum $user)) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cubepilot.labels" $ | nindent 4 }}
stringData:
  config: |
{{ $content | indent 4 }}
{{- end }}
{{- end }}
