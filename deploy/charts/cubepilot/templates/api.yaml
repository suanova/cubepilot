# API -- Portal REST/SSE + JSON metadata store. Stateless except the single
# RWO PVC -> single replica today; shared storage enables replicas > 1
# (design §9 / §11.1).
{{- $skillRepo := default dict .Values.api.skillRepo }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.api.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.api.name }}
        {{- include "cubepilot.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.api }}
      # Container runs as a non-root uid (1000); make the data PVC writable.
      securityContext:
        fsGroup: 1000
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "cubepilot.agentEnv" . | nindent 12 }}
            - name: CUBEPILOT_DATA_DIR
              value: {{ .Values.api.dataDir }}
            - name: CUBEPILOT_SKILLS_DIR
              value: /var/lib/cubepilot/skills
            - name: CUBEPILOT_HITL_ENABLED
              value: "{{ .Values.api.hitl.enabled }}"
            {{- range .Values.api.extraEnv }}
            - name: {{ .name }}
              {{- if .secretKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretKeyRef.name }}
                  key: {{ .secretKeyRef.key }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
            {{- end }}
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: {{ .Values.api.dataDir }}
            - name: skill-repo
              mountPath: /var/lib/cubepilot/skills
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.api.name }}-data
        - name: skill-repo
          {{- if $skillRepo.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $skillRepo.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.api.name }}-skill-repo
          {{- end }}
---
# Metadata store for tasks / reports / audit / agent config (JSON "tables").
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.api.name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.api.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.storage }}
---
# Shared skill repository (design §2.2). Only the API server mounts it; the
# operator publishes skills over HTTP. AccessModes default to ReadWriteOnce
# (single-replica API, kind-friendly); production multi-replica sets RWX with a
# CephFS StorageClass. Skipped when api.skillRepo.existingClaim is set.
{{- if not $skillRepo.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.api.name }}-skill-repo
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: {{ toYaml (default (list "ReadWriteOnce") $skillRepo.accessModes) | nindent 2 }}
  {{- with $skillRepo.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $skillRepo.size | default "1Gi" }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.api.name }}
  ports:
    - port: 8080
      targetPort: 8080
