---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: agenttemplates.ai.cubestack.io
spec:
  group: ai.cubestack.io
  names:
    kind: AgentTemplate
    listKind: AgentTemplateList
    plural: agenttemplates
    singular: agenttemplate
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: DisplayName
      type: string
    - jsonPath: .spec.runtime
      name: Runtime
      type: string
    - jsonPath: .spec.registry.builtin
      name: Builtin
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentTemplate is the declarative definition of an agent (design doc §3.1)
          -- the platform's first-class object. The builtin agent-for-cloud is the
          preset first template; user-created templates are phase 2+.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentTemplateSpec defines what an AgentTemplate is: model, instructions,
              tools (skill refs), memory, identity, policy and registry metadata
              (design §3.1). It is the "class": shared by all instances, versioned,
              user-independent.
            properties:
              confirmPolicy:
                default: ConfirmWrites
                description: |-
                  ConfirmPolicy is the template-level confirmation policy for write
                  operations (default ConfirmWrites).
                enum:
                - None
                - ConfirmWrites
                type: string
              defaultModel:
                description: |-
                  DefaultModel is the model name from Models used when an instance does
                  not select a model explicitly. Empty = no default / runtime default.
                type: string
              description:
                description: Description explains what the template does.
                type: string
              displayName:
                description: DisplayName is the human-facing template name.
                type: string
              identity:
                description: Identity declares the identity mode and scope.
                properties:
                  mode:
                    default: user
                    description: Mode is user | service (default user).
                    type: string
                  scope:
                    description: Scope is a coarse permission scope hint (e.g. project-write).
                    type: string
                type: object
              instructions:
                description: |-
                  Instructions is the default system prompt (definition-level default;
                  instances may append within capability bounds).
                type: string
              memory:
                description: Memory declares the memory capability.
                properties:
                  enabled:
                    description: Enabled toggles persistent memory for instances of
                      this template.
                    type: boolean
                type: object
              models:
                description: |-
                  Models is the inline model list (design §3.3: models are inlined in the
                  template -- no standalone Model CRD). The first entry is the primary;
                  instances select within this list. Every model requires an endpoint;
                  credentialRef is optional (a public model has none).
                items:
                  description: |-
                    TemplateModelSpec is one entry of the inline model list of an AgentTemplate
                    (design §3.3: models are inlined -- no standalone Model CRD). Name is the
                    catalog name, the selection key (selectedModel), the gateway provider key
                    and the backend model id sent to the endpoint. Every model is a concrete
                    OpenAI-compatible endpoint; a public model simply omits CredentialRef.
                  properties:
                    credentialRef:
                      description: |-
                        CredentialRef optionally references a platform-managed Secret (name)
                        holding the apiKey; public models omit it. References only -- never the
                        key itself (design §4.4).
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    endpoint:
                      description: Endpoint is the OpenAI-compatible base URL; required
                        for every model.
                      type: string
                    name:
                      description: |-
                        Name is the model name: the key for selectedModel on instances, the
                        gateway provider key, and the model id passed to the LLM endpoint.
                      type: string
                  required:
                  - endpoint
                  - name
                  type: object
                type: array
                x-kubernetes-validations:
                - message: every model requires an endpoint
                  rule: self.all(m, has(m.endpoint))
                - message: credentialRef must reference a Secret name
                  rule: self.all(m, !has(m.credentialRef) || has(m.credentialRef.name))
              policyRefs:
                description: PolicyRefs references confirmation-rule policies (E3,
                  phase 2).
                items:
                  type: string
                type: array
              quotas:
                description: Quotas caps instances per user (NFR-015).
                properties:
                  maxInstancesPerUser:
                    default: 1
                    description: |-
                      MaxInstancesPerUser caps instances per user for this template
                      (default 1).
                    format: int32
                    type: integer
                type: object
              registry:
                description: Registry carries publish / visibility metadata.
                properties:
                  builtin:
                    description: |-
                      Builtin marks platform-preset templates (every user gets an instance
                      automatically; cannot be deleted).
                    type: boolean
                  visibility:
                    default: system
                    description: Visibility is system | platform-reviewed | public
                      (default system).
                    type: string
                type: object
              runtime:
                default: OpenClaw
                description: Runtime selects the runtime implementation (OpenClaw
                  default).
                enum:
                - OpenClaw
                - Hermes
                type: string
              skills:
                description: |-
                  Skills references Skills (domain knowledge + controlled scripts),
                  design §3.1 `spec.skills` / §3.4. Generic tools (kubectl exec + schema
                  discovery) are platform-provided and always available -- NOT listed here.
                items:
                  type: string
                type: array
            type: object
          status:
            description: |-
              AgentTemplateStatus is the observed state of an AgentTemplate definition
              (phase one: minimal).
            properties:
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
