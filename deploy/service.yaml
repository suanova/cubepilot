# CubePilot deployment: two components (design doc §9 / §11.1).
#
#   cubepilot-operator : the platform controllers (AgentInstance / builtin
#                        bootstrap / scheduler). Leader election is always on;
#                        run 2 replicas in production (Active/Standby). No HTTP
#                        listener, no PVC.
#   cubepilot-api      : the Portal + REST/SSE API. Stateless except the JSON
#                        metadata store on a single RWO PVC → single replica
#                        (shared storage enables replicas > 1, phase two).
#
# Agent instances are per-user stateful singletons (0..N = user count, not
# replicas); they are never copied.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubepilot-operator
  namespace: cubepilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cubepilot-operator
  template:
    metadata:
      labels:
        app: cubepilot-operator
    spec:
      serviceAccountName: cubepilot-operator
      containers:
        - name: operator
          image: cubepilot-operator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: CUBEPILOT_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-config
                  key: gatewayToken
            - name: CUBEPILOT_NAMESPACE
              value: cubepilot
            - name: CUBEPILOT_AGENT_IMAGE
              value: cubepilot-agent:local
            - name: CUBEPILOT_RECLAIM
              value: "false" # resident by default; idle reclaim is a configurable policy (FR-M2-002)
            - name: CUBEPILOT_IDLE_TTL
              value: 30m
            - name: CUBEPILOT_GC_WINDOW
              value: 72h
            - name: CUBEPILOT_GC_WATERMARK
              value: "0.7"
            - name: CUBEPILOT_USERS
              value: zhang.wei,li.ming
---
apiVersion: v1
kind: Service
metadata:
  name: cubepilot-operator
  namespace: cubepilot
spec:
  # Headless: nothing routes to the operator (it exposes no HTTP); the
  # Service keeps the component discoverable for pod identity/owner labels.
  clusterIP: None
  selector:
    app: cubepilot-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubepilot-api
  namespace: cubepilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cubepilot-api
  template:
    metadata:
      labels:
        app: cubepilot-api
    spec:
      serviceAccountName: cubepilot-api
      # Container runs as `node` (uid 1000); make the data PVC writable.
      securityContext:
        fsGroup: 1000
      containers:
        - name: api
          image: cubepilot-api:local
          imagePullPolicy: IfNotPresent
          env:
            - name: CUBEPILOT_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-config
                  key: gatewayToken
            - name: CUBEPILOT_NAMESPACE
              value: cubepilot
            - name: CUBEPILOT_AGENT_IMAGE
              value: cubepilot-agent:local
            - name: CUBEPILOT_RECLAIM
              value: "false"
            - name: CUBEPILOT_IDLE_TTL
              value: 30m
            - name: CUBEPILOT_USERS
              value: zhang.wei,li.ming
            - name: CUBEPILOT_DATA_DIR
              value: /opt/cubepilot/data
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /opt/cubepilot/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cubepilot-data
---
# CubePilot Portal — independent frontend component (design §9 / §11.1: UI 独
# 立部署). Serves the built Vue SPA and reverse-proxies /api to the API
# service (web/nginx.conf). Replicas > 1 is safe: the SPA is fully stateless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubepilot-web
  namespace: cubepilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cubepilot-web
  template:
    metadata:
      labels:
        app: cubepilot-web
    spec:
      containers:
        - name: web
          image: cubepilot-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cubepilot-web
  namespace: cubepilot
spec:
  selector:
    app: cubepilot-web
  ports:
    - port: 80
      targetPort: 80
---
# Metadata store for tasks / reports / audit / agent config (JSON "tables").
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cubepilot-data
  namespace: cubepilot
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cubepilot-api
  namespace: cubepilot
spec:
  selector:
    app: cubepilot-api
  ports:
    - port: 8080
      targetPort: 8080
---
# Portal entry — the web component (nginx) reverse-proxies /api to
# cubepilot-api (web/nginx.conf).
apiVersion: v1
kind: Service
metadata:
  name: cubepilot
  namespace: cubepilot
spec:
  selector:
    app: cubepilot-web
  ports:
    - port: 8080
      targetPort: 80
