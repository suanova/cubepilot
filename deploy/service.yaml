# The assistant service + Instance Manager (merged in one Deployment for the PoC).
# IM/调度器单副本起步（design §3.3/§11.1）: Leader Election 仅适用于控制面组件，
# 单副本阶段无选举开销；控制器化实现时随框架（--leader-elect）平滑升 2 副本。
# Agent 实例是每用户有状态单例（0~N 为用户数），不做副本复制。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubepilot
  namespace: cubepilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cubepilot
  template:
    metadata:
      labels:
        app: cubepilot
    spec:
      serviceAccountName: cubepilot-manager
      # Container runs as `node` (uid 1000); make the data PVC writable.
      securityContext:
        fsGroup: 1000
      containers:
        - name: cubepilot
          image: cubepilot-service:local
          imagePullPolicy: IfNotPresent
          env:
            - name: CUBEPILOT_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-config
                  key: gatewayToken
            - name: CUBEPILOT_NAMESPACE
              value: cubepilot
            - name: CUBEPILOT_AGENT_IMAGE
              value: cubepilot-agent:local
            - name: CUBEPILOT_REPLICAS
              value: "1"
            - name: CUBEPILOT_RECLAIM
              value: "false" # 常驻运行（默认）；闲置回收为可配置策略 FR-M2-002
            - name: CUBEPILOT_IDLE_TTL
              value: 30m
            - name: CUBEPILOT_GC_WINDOW
              value: 72h
            - name: CUBEPILOT_GC_WATERMARK
              value: "0.7"
            - name: CUBEPILOT_USERS
              value: zhang.wei,li.ming
            - name: CUBEPILOT_DATA_DIR
              value: /opt/cubepilot/data
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /opt/cubepilot/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cubepilot-data
---
# Metadata store for tasks / reports / audit / agent config (元数据表, JSON).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cubepilot-data
  namespace: cubepilot
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cubepilot
  namespace: cubepilot
spec:
  selector:
    app: cubepilot
  ports:
    - port: 8080
      targetPort: 8080
