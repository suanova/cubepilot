# CubePilot RBAC (design doc §9 / §11.1: components separated, RBAC
# minimized per component).
#
#   cubepilot-operator : the control plane. Manages per-user
#                        Pods/PVCs/Services in the namespace, the
#                        leader-election Lease, and the platform CRDs
#                        (Agent / AgentInstance / Capability / TaskTemplate /
#                        Task / TaskRun — cluster-scoped, design §3).
#   cubepilot-api      : the Portal/API. Reads the platform CRDs only
#                        (never writes — the operator owns the control plane);
#                        no pod permissions.
#   cubepilot-agent    : the identity each per-user agent Pod uses for
#                        `kubectl` (cluster-scoped, intentionally broad for
#                        now — the production contract is per-user minimal
#                        RBAC, FR-M3-001).
#
# 巡检（FR-M4-007）以创建者身份执行、权限与创建者一致（design §5.4 / FR-M4 授权
# 约定）——不设专用只读凭据；只读由巡检模板行为约束 + RBAC 兜底，残留风险与
# 「创建者派生只读凭据」加固项（阶段二、Q-002）记入设计文档 §5.4/§13。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubepilot-operator
  namespace: cubepilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubepilot-api
  namespace: cubepilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubepilot-agent
  namespace: cubepilot
---
# Operator: manage per-user Pods/PVCs/Services within the namespace plus the
# leader-election Lease (design §3.3: IM 单副本起步, 控制器化后随框架升 2 副本).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cubepilot-operator
  namespace: cubepilot
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cubepilot-operator
  namespace: cubepilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cubepilot-operator
subjects:
  - kind: ServiceAccount
    name: cubepilot-operator
    namespace: cubepilot
---
# Platform CRDs are cluster-scoped (design §3). The operator needs full CRUD
# on the platform CRs + their status subresources; the API needs read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cubepilot-operator-crds
rules:
  - apiGroups: ["assistant.suanova.io"]
    resources: ["agents", "agentinstances", "capabilities", "tasktemplates", "tasks", "taskruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["assistant.suanova.io"]
    resources: ["agents/status", "agentinstances/status", "tasks/status", "taskruns/status", "capabilities/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cubepilot-operator-crds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cubepilot-operator-crds
subjects:
  - kind: ServiceAccount
    name: cubepilot-operator
    namespace: cubepilot
---
# API: read-only access to the platform CRDs + CRD schemas (capability
# catalog discovery). No pod/lease permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cubepilot-api
rules:
  - apiGroups: ["assistant.suanova.io"]
    resources: ["agents", "agentinstances", "capabilities", "tasktemplates", "tasks", "taskruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cubepilot-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cubepilot-api
subjects:
  - kind: ServiceAccount
    name: cubepilot-api
    namespace: cubepilot
---
# Agent instances: read cluster state, write pods (current scope — broad;
# FR-M3-001 per-user minimal RBAC is the production contract).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cubepilot-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Platform CRDs (DevEnvironment / InferenceService / ...) — current wildcard.
  - apiGroups: ["assistant.suanova.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cubepilot-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cubepilot-agent
subjects:
  - kind: ServiceAccount
    name: cubepilot-agent
    namespace: cubepilot
