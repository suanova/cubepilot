# RBAC for the CubePilot PoC.
#   cubepilot-manager : the assistant service / Instance Manager (namespace-scoped).
#   cubepilot-agent   : the identity each per-user agent Pod uses for `kubectl`
#                       (cluster-scoped, intentionally broad for the demo — the
#                       production contract is per-user minimal RBAC, FR-M3-001).
#
# 巡检（FR-M4-007）以创建者身份执行、权限与创建者一致（design §5.4 / FR-M4 授权
# 约定）——不设专用只读凭据；只读由巡检模板行为约束 + RBAC 兜底，残留风险与
# 「创建者派生只读凭据」加固项（阶段二、Q-002）记入设计文档 §5.4/§13。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubepilot-manager
  namespace: cubepilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubepilot-agent
  namespace: cubepilot
---
# Instance Manager: manage per-user Pods/PVCs/Services within the namespace,
# plus leader-election Leases (design §3.3: IM 单副本起步, 控制器化后随框架升 2 副本).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cubepilot-manager
  namespace: cubepilot
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "services", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cubepilot-manager
  namespace: cubepilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cubepilot-manager
subjects:
  - kind: ServiceAccount
    name: cubepilot-manager
    namespace: cubepilot
---
# Agent instances: read cluster state, write pods (demo scope — broad).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cubepilot-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Platform CRDs (DevEnvironment / InferenceService / ...) — demo wildcard.
  - apiGroups: ["assistant.suanova.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cubepilot-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cubepilot-agent
subjects:
  - kind: ServiceAccount
    name: cubepilot-agent
    namespace: cubepilot
