# RBAC for the CubePilot PoC.
#   cubepilot-manager : the assistant service / Instance Manager (namespace-scoped).
#   cubepilot-agent   : the identity each per-user agent Pod uses for `kubectl`
#                       (cluster-scoped, intentionally broad for the demo — the
#                       production contract is per-user minimal RBAC, FR-M3-001).
#   cubepilot-agent-inspect : read-only identity for inspection instances
#                       (design §5.4 权限边界技术强制 — cannot write even when
#                       the agent is prompt-injected).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubepilot-manager
  namespace: cubepilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubepilot-agent
  namespace: cubepilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubepilot-agent-inspect
  namespace: cubepilot
---
# Instance Manager: manage per-user Pods/PVCs/Services within the namespace,
# plus leader-election Leases (design §3.3 多副本 Active/Standby).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cubepilot-manager
  namespace: cubepilot
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "services", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cubepilot-manager
  namespace: cubepilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cubepilot-manager
subjects:
  - kind: ServiceAccount
    name: cubepilot-manager
    namespace: cubepilot
---
# Agent instances: read cluster state, write pods (demo scope — broad).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cubepilot-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Platform CRDs (DevEnvironment / InferenceService / ...) — demo wildcard.
  - apiGroups: ["assistant.suanova.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cubepilot-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cubepilot-agent
subjects:
  - kind: ServiceAccount
    name: cubepilot-agent
    namespace: cubepilot
---
# Inspection instances (design §5.4): read-only whitelist — get/list/watch on a
# bounded resource subset. No create/update/patch/delete anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cubepilot-agent-inspect
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "events", "pods", "persistentvolumeclaims", "componentstatuses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cubepilot-agent-inspect
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cubepilot-agent-inspect
subjects:
  - kind: ServiceAccount
    name: cubepilot-agent-inspect
    namespace: cubepilot
