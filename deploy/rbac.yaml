# CubePilot PoC RBAC.
#   cubepilot-manager : the assistant service / controllers (namespace-scoped
#                       + cluster-scoped platform CRDs).
#   cubepilot-agent   : the identity each per-user agent Pod uses for `kubectl`
#                       (cluster-scoped, intentionally broad for the demo — the
#                       production contract is per-user minimal RBAC, FR-M3-001).
#
# 巡检（FR-M4-007）以创建者身份执行、权限与创建者一致（design §5.4 / FR-M4 授权
# 约定）——不设专用只读凭据；只读由巡检模板行为约束 + RBAC 兜底，残留风险与
# 「创建者派生只读凭据」加固项（阶段二、Q-002）记入设计文档 §5.4/§13。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubepilot-manager
  namespace: cubepilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubepilot-agent
  namespace: cubepilot
---
# Instance Manager / controllers: manage per-user Pods/PVCs/Services within the
# namespace, leader-election Leases (设计 §3.3: IM 单副本起步, 控制器化后随框架
# 升 2 副本), and the platform CRDs (Agent / AgentInstance / Capability /
# TaskTemplate / Task / TaskRun — 设计 §3, 集群级).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cubepilot-manager
  namespace: cubepilot
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "services", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cubepilot-manager
  namespace: cubepilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cubepilot-manager
subjects:
  - kind: ServiceAccount
    name: cubepilot-manager
    namespace: cubepilot
---
# Platform CRDs are cluster-scoped (设计 §3: Agent / AgentInstance / Capability /
# TaskTemplate / Task / TaskRun 均为集群级资源).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cubepilot-manager-crds
rules:
  - apiGroups: ["assistant.suanova.io"]
    resources: ["agents", "agentinstances", "capabilities", "tasktemplates", "tasks", "taskruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["assistant.suanova.io"]
    resources: ["agents/status", "agentinstances/status", "tasks/status", "taskruns/status", "capabilities/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cubepilot-manager-crds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cubepilot-manager-crds
subjects:
  - kind: ServiceAccount
    name: cubepilot-manager
    namespace: cubepilot
---
# Agent instances: read cluster state, write pods (demo scope — broad).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cubepilot-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Platform CRDs (DevEnvironment / InferenceService / ...) — demo wildcard.
  - apiGroups: ["assistant.suanova.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cubepilot-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cubepilot-agent
subjects:
  - kind: ServiceAccount
    name: cubepilot-agent
    namespace: cubepilot
