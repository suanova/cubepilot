# In-cluster kubeconfig for the platform (cubepilot-agent SA) identity. Under
# dual-kubeconfig (issue #19) it is mounted on the agent Pod's NON-default path
# $CUBEPILOT_PLATFORM_KUBECONFIG (/home/node/.kube/platform/config) and used
# only for CRD/kind schema discovery; user-facing kubectl runs with the user's
# own kubeconfig (per-user Secret). It uses the Pod's own ServiceAccount token
# and CA against the same cluster.
apiVersion: v1
kind: Config
clusters:
  - cluster:
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      server: https://kubernetes.default.svc
    name: in-cluster
contexts:
  - context:
      cluster: in-cluster
      user: agent
    name: in-cluster
current-context: in-cluster
users:
  - name: agent
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
