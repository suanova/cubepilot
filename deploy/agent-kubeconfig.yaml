# In-cluster kubeconfig injected into each agent Pod (mounted at
# /home/node/.kube/config). It uses the Pod's own ServiceAccount token and CA,
# so the agent's `kubectl` acts as SA `cubepilot-agent` against the same cluster.
apiVersion: v1
kind: Config
clusters:
  - cluster:
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      server: https://kubernetes.default.svc
    name: in-cluster
contexts:
  - context:
      cluster: in-cluster
      user: agent
    name: in-cluster
current-context: in-cluster
users:
  - name: agent
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
