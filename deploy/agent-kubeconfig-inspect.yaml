# In-cluster kubeconfig injected into each read-only inspection instance
# (mounted at /home/node/.kube/config). It uses the Pod's own ServiceAccount
# token and CA, so the inspection agent's `kubectl` acts as SA
# `cubepilot-agent-inspect` — a read-only ClusterRole (design §5.4 权限边界
# 技术强制: 即使被注入也无法写入).
apiVersion: v1
kind: Config
clusters:
  - cluster:
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      server: https://kubernetes.default.svc
    name: in-cluster
contexts:
  - context:
      cluster: in-cluster
      user: agent
    name: in-cluster
current-context: in-cluster
users:
  - name: agent
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
