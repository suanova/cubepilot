# CubePilot Portal — nginx: serve the built SPA and reverse-proxy /api to the
# cubepilot-api service (same namespace). The SPA uses history-mode routing,
# so unknown paths fall back to index.html.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API reverse proxy — the API service owns /api/* (REST + SSE).
    location /api/ {
        proxy_pass         http://cubepilot-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # SSE: disable buffering so message deltas stream through immediately.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_set_header   Connection "";
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively, index.html fresh.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
