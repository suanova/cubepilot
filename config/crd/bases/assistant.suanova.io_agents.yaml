---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: agents.assistant.suanova.io
spec:
  group: assistant.suanova.io
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: DisplayName
      type: string
    - jsonPath: .spec.runtime
      name: Runtime
      type: string
    - jsonPath: .spec.registry.builtin
      name: Builtin
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Agent is the declarative definition of an agent (design doc §3.1) — the
          platform's first-class object. The builtin agent-for-cloud is the preset
          first Agent; user-created agents are phase 2+.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSpec defines what an Agent is: model, instructions, tools (capability
              refs), memory, identity, policy and registry metadata (design §3.1).
              It is the "class": shared by all instances, versioned, user-independent.
            properties:
              description:
                description: Description explains what the agent does.
                type: string
              displayName:
                description: DisplayName is the human-facing agent name.
                type: string
              identity:
                description: Identity declares the identity mode and scope.
                properties:
                  mode:
                    default: user
                    description: Mode is user | service (default user).
                    type: string
                  scope:
                    description: Scope is a coarse permission scope hint (e.g. project-write).
                    type: string
                type: object
              instructions:
                description: |-
                  Instructions is the default system prompt (definition-level default;
                  instances may override within capability bounds).
                type: string
              memory:
                description: Memory declares the memory capability.
                properties:
                  enabled:
                    description: Enabled toggles persistent memory for instances of
                      this agent.
                    type: boolean
                type: object
              model:
                description: |-
                  Model is the ordered model array (allowlist). model[0] = primary;
                  model[1:] = fallback chain. Instances select within this list.
                items:
                  description: |-
                    ModelSpec is one entry of the ordered model array of an Agent definition.
                    model[0] is the primary model; model[1:] are the fallback chain (design doc
                    §3.1 FR-M2-003: model-agnostic, supports custom LLMs; fallback depends on runtime capability).
                  properties:
                    apiKeyRef:
                      description: |-
                        APIKeyRef is a platform-managed Secret reference (shared default
                        credential). References only — never the key itself (design §4.4).
                      type: string
                    endpoint:
                      description: Endpoint is the OpenAI-compatible base URL; required
                        for external.
                      type: string
                    name:
                      description: Name is the model name (and the key for selectedModel
                        on instances).
                      type: string
                    provider:
                      description: |-
                        Provider is "platform" (builtin inference pool) or "external" (OpenAI-compatible
                        endpoint; endpoint + apiKeyRef required).
                      type: string
                  required:
                  - name
                  - provider
                  type: object
                type: array
              policyRefs:
                description: PolicyRefs references confirmation-rule policies (E3,
                  phase 2).
                items:
                  type: string
                type: array
              quotas:
                description: Quotas caps instances per user (NFR-015).
                properties:
                  maxInstancesPerUser:
                    default: 1
                    description: MaxInstancesPerUser caps instances per user for this
                      agent (default 1).
                    format: int32
                    type: integer
                type: object
              registry:
                description: Registry carries publish / visibility metadata.
                properties:
                  builtin:
                    description: |-
                      Builtin marks platform-preset agents (every user gets an instance
                      automatically; cannot be deleted).
                    type: boolean
                  visibility:
                    default: system
                    description: Visibility is system | platform-reviewed | public
                      (default system).
                    type: string
                type: object
              runtime:
                default: openclaw
                description: Runtime selects the runtime implementation (openclaw
                  default).
                type: string
              tools:
                description: |-
                  Tools references Capabilities (atomic thin-overrides + domain skills).
                  Generic tools (resource-manager / list-kinds / describe-kind) are
                  platform-provided and always available — they are NOT listed here.
                items:
                  type: string
                type: array
            type: object
          status:
            description: 'AgentStatus is the observed state of an Agent definition
              (phase one: minimal).'
            properties:
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
