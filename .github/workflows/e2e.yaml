name: e2e

on:
  push:
    branches: [main]
  # pull_request_target so fork PRs can access repository secrets (chat e2e).
  # NOTE: the workflow definition is loaded from the base branch, so this only
  # takes effect for fork PRs after it lands on main. The jobs check out the PR
  # head explicitly (see the checkout steps) so the PR's code is what runs.
  # Security: the PR's checked-out code runs with the secret in scope; the
  # GITHUB_TOKEN is limited to contents: read (below).
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests + static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target checks out the base branch by default; check out the
      # PR head so we test the PR's code (fall back to the current ref for
      # push / workflow_dispatch events).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test ./...
      - run: bash scripts/test-openclaw-config.sh

  e2e:
    name: End-to-end (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      # Same PR-head checkout rationale as the test job (see above).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Install kind
        run: |
          sudo curl -fsSLo /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -fsSLO "https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Pre-pull base images (de-risk BuildKit metadata pulls)
        run: |
          docker pull harbor.isuanova.com/library/golang:1.26-bookworm
          docker pull harbor.isuanova.com/library/debian:bookworm-slim
          docker pull harbor.isuanova.com/library/openclaw:2026.6.33
          docker pull harbor.isuanova.com/library/node:24-alpine
          docker pull harbor.isuanova.com/library/nginx:1.27-alpine

      # The full conversational e2e needs a real model-provider key. Configure
      # it as the GitHub secret CUBEPILOT_MODEL_PROVIDERS (the models.providers
      # object, e.g. {"deepseek":{"api":"openai-completions","apiKey":"sk-...",
      # "baseUrl":"https://api.deepseek.com","models":[{"id":"deepseek-v4-flash"}]}}).
      # Without the secret the job still runs the deploy path with a placeholder.
      - name: Run e2e (deploy, or deploy + chat when the provider secret is set)
        env:
          CHAT_PROVIDER: ${{ secrets.CUBEPILOT_MODEL_PROVIDERS }}
        run: |
          set -euo pipefail
          if [ -n "$CHAT_PROVIDER" ]; then
            echo "::group::e2e deploy + chat (real provider)"
            CUBEPILOT_MODEL_PROVIDERS="$CHAT_PROVIDER" CUBEPILOT_E2E_CHAT=1 scripts/e2e.sh
            echo "::endgroup::"
          else
            echo "::group::e2e deploy only (placeholder provider)"
            CUBEPILOT_MODEL_PROVIDERS='{"deepseek":{"api":"openai-completions","apiKey":"sk-placeholder","baseUrl":"https://api.deepseek.com","models":[{"id":"deepseek-v4-flash","name":"DeepSeek V4 Flash"}]}}' scripts/e2e.sh
            echo "::endgroup::"
          fi
