# Build & publish CubePilot images and the Helm chart (OCI format) into
# harbor.isuanova.com. Tracks suanova/cubepilot#35.
#
# Triggers and published tags:
#   - push to main       images pushed as `latest`; chart pushed as
#                        oci://.../suanova/cubepilot-chart:<chartVersion>-latest
#                        (rolling dev artifact -- the `-latest` suffix keeps it
#                        from colliding with a real <chartVersion> release)
#   - push tag vX.Y.Z    images + chart published as X.Y.Z (chart version is
#                        pinned to X.Y.Z regardless of Chart.yaml)
#   - workflow_dispatch  publish under the semver tag supplied in the input
#                        (re-publishing, and exercising the workflow without
#                        cutting a tag)
#
# Publishing is all this workflow does. Creating the GitHub Release stays a
# deliberate, human step done from the UI -- a release page carries written
# context that no generated changelog has, and it is where the tag gets cut.
# What must be automatic is that the artifacts behind a tag reach Harbor.
#
# A release tag is validated as semver before the build steps: a malformed tag
# is not caught by anything downstream (see the "Resolve and validate publish
# tag" step), and publishing under it would put a version that is not semver --
# or an unbootable image reference -- into the registry.
#
# Bumping Chart.yaml's version/appVersion is not required for a release -- both
# are overridden at package time -- but keeping them in step with the next
# release is what names the rolling chart on main (see the "Package Helm chart"
# step below).
#
# Required GitHub variable + secret (a Harbor bot account with push rights on
# the `suanova` project):
#   vars.CI_BOT_NAME         (Harbor username)
#   secrets.CI_BOT_PASSWORD  (Harbor password/token)

name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Semver tag to publish (e.g. 0.1.0); also becomes the Helm chart version.'
        required: true

permissions:
  contents: read

env:
  REGISTRY: harbor.isuanova.com
  CHART_OCI: oci://harbor.isuanova.com/suanova

jobs:
  publish:
    name: Build & push images and chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image_pushed: ${{ steps.image.outputs.pushed }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve and validate publish tag
        id: tag
        env:
          # Passed through env rather than interpolated into the script: an
          # input is attacker-shaped text, and `${{ }}` inside a run block is
          # pasted into the shell verbatim.
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              VERSION="${INPUT_TAG#v}"                  # accept 2.0.0 or v2.0.0
              ;;
            push)
              if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                VERSION="${GITHUB_REF_NAME#v}"          # v0.1.0 -> 0.1.0
              else
                VERSION="latest"                        # push to main
              fi ;;
            *) echo "::error::unsupported trigger: $GITHUB_EVENT_NAME"; exit 1 ;;
          esac

          # The chart version is bare SemVer; the image tag and chart appVersion
          # keep the Git tag's v, so both stay in step. `latest` is the rolling
          # main path only -- a release input or a vlatest tag must not take it.
          if [ "$VERSION" = "latest" ] && ! { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; }; then
            echo "::error::release inputs cannot use latest"
            exit 1
          fi
          if [ "$VERSION" = "latest" ]; then
            APP_VERSION=latest
          else
            APP_VERSION="v${VERSION}"
          fi

          # Fail here, before anything is built or pushed. `latest` is the
          # rolling artifact published from main and is exempt; a tag pushed as
          # vX.Y.Z has already had its `v` stripped above.
          #
          # SemVer, without build metadata. Each of the three dotted numbers is
          # `0` or has no leading zero, and each dot-separated prerelease
          # identifier is either numeric with no leading zero or contains a
          # letter or hyphen -- so `1.0.0-01` and `1.0.0-alpha..1` are rejected
          # rather than published as a malformed version.
          #
          # This is stricter than any single downstream step, because two bad
          # tags would otherwise get past them all:
          #   - helm accepts a malformed version like `1.0` or `v1` and writes
          #     it into the chart verbatim, so a release would ship a version
          #     that is not semver and no step would complain;
          #   - build metadata (`0.1.0+build`) is valid semver and helm takes
          #     it, but `+` is not legal in an image tag, so the job would die
          #     inside `make images` with "invalid reference format".
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'

          if [ "$VERSION" != "latest" ] && ! printf '%s' "$VERSION" | grep -Eq "$SEMVER"; then
            echo "::error::'$VERSION' is not a release version; expected X.Y.Z or X.Y.Z-<prerelease>"
            exit 1
          fi

          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "app-version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve chart version and image tag
        id: chart-version
        run: |
          set -euo pipefail
          BASE_VERSION="$(grep '^version:' deploy/charts/cubepilot-chart/Chart.yaml | awk '{print $2}')"
          if [ "${{ steps.tag.outputs.tag }}" = "latest" ]; then
            IMAGE_TAG="sha-${GITHUB_SHA::7}"
          else
            IMAGE_TAG="${{ steps.tag.outputs.app-version }}"
          fi
          echo "version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Install helm
        uses: azure/setup-helm@v5

      - name: Install oras
        uses: oras-project/setup-oras@v2
        with:
          version: 1.2.0

      # Credentials are passed via env (not inlined into the shell command):
      # the Harbor robot username contains a literal '$' (e.g. robot$ci-bot)
      # which the shell would otherwise expand into a variable reference.
      - name: Login to Harbor (docker + helm)
        env:
          CI_BOT_NAME: ${{ vars.CI_BOT_NAME }}
          CI_BOT_PASSWORD: ${{ secrets.CI_BOT_PASSWORD }}
        run: |
          echo "$CI_BOT_PASSWORD" | docker login "$REGISTRY" \
            -u "$CI_BOT_NAME" --password-stdin
          echo "$CI_BOT_PASSWORD" | helm registry login "$REGISTRY" \
            -u "$CI_BOT_NAME" --password-stdin
          echo "$CI_BOT_PASSWORD" | oras login "$REGISTRY" \
            -u "$CI_BOT_NAME" --password-stdin

      - name: Pre-pull base images (de-risk BuildKit metadata pulls)
        run: |
          docker pull harbor.isuanova.com/library/golang:1.26-bookworm
          docker pull harbor.isuanova.com/library/openclaw:2026.8.2
          docker pull harbor.isuanova.com/library/node:24-alpine
          docker pull harbor.isuanova.com/library/nginx:1.27-alpine

      - name: Build images
        run: make images IMAGE_TAG=${{ steps.chart-version.outputs.image-tag }}

      - name: Push images
        id: image
        run: |
          make push IMAGE_TAG=${{ steps.chart-version.outputs.image-tag }}
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Package Helm chart
        id: chart
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          APP_VERSION="${{ steps.tag.outputs.app-version }}"
          BASE_VERSION="${{ steps.chart-version.outputs.version }}"
          if [ "$TAG" = "latest" ]; then
            # Dev and GA share the chart bytes: the version and appVersion are
            # the component version, not a rolling suffix.
            VERSION="$BASE_VERSION"
            APP_VERSION="v${BASE_VERSION}"
          else
            VERSION="$TAG"
          fi
          helm package deploy/charts/cubepilot-chart \
            --version "$VERSION" --app-version "$APP_VERSION" -d .chart
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tgz=$(ls .chart/cubepilot-chart-${VERSION}.tgz)" >> "$GITHUB_OUTPUT"

      # The OCI repository the chart lands in is `<CHART_OCI>/<Chart.yaml name>`
      # -- helm takes it from the chart metadata, not from the .tgz filename or
      # the package directory, so renaming the chart renames the Harbor repo.
      - name: Push Helm chart (OCI)
        if: steps.tag.outputs.tag != 'latest'
        run: helm push .chart/cubepilot-chart-*.tgz "${{ env.CHART_OCI }}"

      - name: Push dev chart with channel tag
        id: devchart
        if: github.ref_type == 'branch' && steps.tag.outputs.tag == 'latest'
        env:
          CHART_OCI: ${{ env.CHART_OCI }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          CHART_TGZ: ${{ steps.chart.outputs.tgz }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import json, os, yaml
          meta = yaml.safe_load(open("deploy/charts/cubepilot-chart/Chart.yaml"))
          json.dump(meta, open(os.path.join(os.environ["RUNNER_TEMP"], "helm-config.json"), "w"), separators=(",", ":"))
          PY
          chart_repo="${CHART_OCI#oci://}/cubepilot-chart"
          chart_channel="sha-${GITHUB_SHA::7}"
          out="$(oras push "${chart_repo}:${chart_channel}" \
            "${CHART_TGZ}:application/vnd.cncf.helm.chart.content.v1.tar+gzip" \
            --config "${RUNNER_TEMP}/helm-config.json:application/vnd.cncf.helm.config.v1+json")"
          manifest_digest="$(printf '%s' "$out" | sed -n 's/^Digest: //p' | tail -1)"
          [ -n "$manifest_digest" ] || { echo "::error::cannot resolve chart manifest digest"; exit 1; }
          tgz_digest="sha256:$(sha256sum "$CHART_TGZ" | awk '{print $1}')"
          echo "manifest_digest=$manifest_digest" >> "$GITHUB_OUTPUT"
          echo "tgz_digest=$tgz_digest" >> "$GITHUB_OUTPUT"
          echo "chart_repo=$chart_repo" >> "$GITHUB_OUTPUT"
          echo "chart_channel=$chart_channel" >> "$GITHUB_OUTPUT"

      - name: Resolve image digests
        id: images
        if: github.ref_type == 'branch' && steps.tag.outputs.tag == 'latest' && steps.image.outputs.pushed == 'true'
        env:
          IMAGES: cubepilot-api cubepilot-openclaw cubepilot-operator cubepilot-web
          IMAGE_TAG: ${{ steps.chart-version.outputs.image-tag }}
        run: |
          set -euo pipefail
          json="$(
            for name in ${IMAGES}; do
              repo="${REGISTRY}/suanova/${name}"
              digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${repo}:${IMAGE_TAG}" \
                | awk -F@ -v r="${repo}" '$1==r {print $2; exit}')"
              [ -n "${digest}" ] || { echo "::error::cannot resolve digest for ${repo}:${IMAGE_TAG}"; exit 1; }
              jq -nc --arg n "${name}" --arg r "${repo}:${IMAGE_TAG}" --arg d "${digest}" \
                '{name:$n,ref:$r,digest:$d}'
            done | jq -sc '.'
          )"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Create an installation token for cubestack-release
        id: release-token
        if: github.ref_type == 'branch' && steps.tag.outputs.tag == 'latest' && steps.devchart.outputs.manifest_digest != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SUANOVA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SUANOVA_BOT_APP_PRIVATE_KEY }}
          owner: suanova
          repositories: cubestack-release
          permission-contents: write

      - name: Dispatch component-built
        if: github.ref_type == 'branch' && steps.tag.outputs.tag == 'latest' && steps.devchart.outputs.manifest_digest != ''
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          REPO: suanova/cubepilot
          COMMIT: ${{ github.sha }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          CHART_REPO: ${{ steps.devchart.outputs.chart_repo }}
          CHART_TGZ_DIGEST: ${{ steps.devchart.outputs.tgz_digest }}
          CHART_MANIFEST_DIGEST: ${{ steps.devchart.outputs.manifest_digest }}
          IMAGES_JSON: ${{ steps.images.outputs.json }}
        run: |
          set -euo pipefail
          tag="v${CHART_VERSION}-dev.${COMMIT:0:7}"
          payload="$(jq -nc \
            --arg repo "${REPO}" \
            --arg commit "${COMMIT}" \
            --arg tag "${tag}" \
            --arg component_version "${CHART_VERSION}" \
            --arg chart_oci "oci://${CHART_REPO}" \
            --arg chart_version "${CHART_VERSION}" \
            --arg chart_digest "${CHART_TGZ_DIGEST}" \
            --arg chart_manifest_digest "${CHART_MANIFEST_DIGEST}" \
            --argjson images "${IMAGES_JSON}" \
            '{event_type:"component-built",client_payload:{repo:$repo,commit:$commit,tag:$tag,component_version:$component_version,chart:{oci:$chart_oci,version:$chart_version,digest:$chart_digest,manifest_digest:$chart_manifest_digest},images:$images}}')"
          for i in 1 2 3; do
            if printf '%s' "${payload}" | gh api --method POST \
                repos/suanova/cubestack-release/dispatches --input -; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::component-built dispatch failed after 3 attempts"
          exit 1
