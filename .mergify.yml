# .mergify.yml
#
# Automates PR merging with Mergify (https://mergify.io).
#
# Model:
#   * A PR is merged as soon as its CI passes and — unless it's from
#     dependabot — a human approves it.
#   * No merge queue: no temporary "checking" PRs are ever created.
#   * Merges use squash so each PR lands as a single commit on main.
#
# The check names come from the split CI workflows:
#   * "Unit tests + static checks"    (ci.yaml,   job: test)
#   * "Web build (type-check + vite)" (ci.yaml,   job: web)
#   * "End-to-end (kind)"             (e2e.yaml,  job: e2e)
#   * "DCO"                           (dco.yaml,  job: dco)
# NOTE: ci.yaml runs on plain `pull_request`, so on fork PRs the first two
# checks depend on the repo's "Run workflows from fork pull requests" setting
# (first-time contributors require one approval). e2e.yaml (pull_request_target)
# runs on fork PRs regardless.
#
# Rules are evaluated top-down; the first one that matches wins, so the
# dependabot rule must come before the approval-requiring one.

pull_request_rules:
  # Dependency bumps are generated upstream, so merge them as soon as CI is
  # green — no human approval required.
  - name: automatically merge dependabot PRs
    conditions:
      - author = dependabot[bot]
      - base = main
      - -draft
      - -conflict
      - label!=do-not-merge
      - check-success="Unit tests + static checks"
      - check-success="Web build (type-check + vite)"
      - check-success="End-to-end (kind)"
      - check-success="DCO"
    actions:
      merge:
        method: squash

  # Everything else needs a human approval on top of green CI.
  - name: automatically merge approved PRs
    conditions:
      - base = main
      - -draft
      - -conflict
      - label!=do-not-merge
      - "#approved-reviews-by >= 1"
      - check-success="Unit tests + static checks"
      - check-success="Web build (type-check + vite)"
      - check-success="End-to-end (kind)"
      - check-success="DCO"
    actions:
      merge:
        method: squash
