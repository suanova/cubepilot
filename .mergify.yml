# .mergify.yml
#
# Automates PR merging with Mergify (https://mergify.io).
#
# Model:
#   * A PR is added to the "default" merge queue as soon as CI passes.
#   * The queue is strict: a queued PR is updated against main before merging.
#   * Merges use squash so each PR lands as a single commit on main.
#
# The check names come from the split CI workflows:
#   * "Unit tests + static checks"    (ci.yaml,   job: test)
#   * "Web build (type-check + vite)" (ci.yaml,   job: web)
#   * "End-to-end (kind)"             (e2e.yaml,  job: e2e)
# NOTE: ci.yaml runs on plain `pull_request`, so on fork PRs the first two
# checks depend on the repo's "Run workflows from fork pull requests" setting
# (first-time contributors require one approval). e2e.yaml (pull_request_target)
# runs on fork PRs regardless.

queue_rules:
  - name: default
    merge_method: squash
    merge_conditions:
      - check-success="Unit tests + static checks"
      - check-success="Web build (type-check + vite)"
      - check-success="End-to-end (kind)"

pull_request_rules:
  - name: queue PRs that pass CI
    conditions:
      - base=main
      - -draft
      - -conflict
      - label!=do-not-merge
      - check-success="Unit tests + static checks"
      - check-success="Web build (type-check + vite)"
      - check-success="End-to-end (kind)"
    actions:
      queue:
        name: default
